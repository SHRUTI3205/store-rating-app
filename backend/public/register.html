<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | Store Rating App</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #3f51b5, #2196f3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #40538b;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #40538b;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #40538b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2f4075;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
        }

        .login-text a {
            color: #40538b;
            font-weight: bold;
            text-decoration: none;
        }

    </style>
</head>

<body>

    <div class="register-container">

        <h1>Create Account</h1>

        <p class="subtitle">
            Register as a new user
        </p>

        <form id="registerForm">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p id="message"></p>

        <p class="login-text">
            Already have an account?
            <a href="login.html">
                Login here
            </a>
        </p>

    </div>


    <script>

        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();

                    const name =
                        document
                            .getElementById("name")
                            .value
                            .trim();

                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();

                    const password =
                        document
                            .getElementById("password")
                            .value;

                    const message =
                        document
                            .getElementById("message");


                    // Clear old message
                    message.innerText = "";


                    try {

                        const response =
                            await fetch("/register", {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        name: name,
                                        email: email,
                                        password: password
                                    })

                            });


                        const data =
                            await response.json();


                        if (!response.ok) {

                            message.style.color =
                                "red";

                            message.innerText =
                                data.message ||
                                "Registration failed";

                            return;
                        }


                        message.style.color =
                            "green";

                        message.innerText =
                            "Registration successful! Redirecting to login...";


                        // Clear form
                        document
                            .getElementById("registerForm")
                            .reset();


                        // Redirect to login
                        setTimeout(() => {

                            window.location.href =
                                "login.html";

                        }, 1500);


                    }

                    catch (error) {

                        console.error(error);

                        message.style.color =
                            "red";

                        message.innerText =
                            "Server error. Please try again.";

                    }

                }
            );

    </script>

</body>
</html>
