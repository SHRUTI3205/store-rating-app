<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard | Store Rating App</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #333;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #4b5f91;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 26px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #adminName {
            font-weight: bold;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            padding: 40px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h2 {
            font-size: 30px;
            color: #4b5f91;
        }

        .welcome p {
            margin-top: 8px;
            color: #666;
        }

        /* =========================
           STATISTICS CARDS
        ========================= */

        .stats-container {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 30px;
            border-radius: 12px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .stat-card h3 {
            color: #666;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .stat-number {
            font-size: 38px;
            font-weight: bold;
            color: #4b5f91;
        }

        /* =========================
           DASHBOARD SECTIONS
        ========================= */

        .section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 35px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            color: #4b5f91;
            margin-bottom: 20px;
        }

        /* =========================
           TABLE
        ========================= */

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #4b5f91;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f8f9fc;
        }

        /* =========================
           SEARCH
        ========================= */

        .search-box {
            width: 100%;
            max-width: 400px;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 16px;
            margin-bottom: 20px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            main {
                padding: 20px;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 8px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <h1>
            ⭐ Store Rating App
        </h1>


        <div class="header-right">

            <span id="adminName">
                Admin
            </span>


            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </header>


    <!-- =========================
         MAIN DASHBOARD
    ========================= -->

    <main>


        <div class="welcome">

            <h2>
                Admin Dashboard
            </h2>

            <p>
                Manage users, stores and ratings from one place.
            </p>

        </div>


        <!-- =========================
             STATISTICS
        ========================= -->

        <div class="stats-container">


            <div class="stat-card">

                <h3>
                    Total Users
                </h3>

                <div
                    class="stat-number"
                    id="totalUsers"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Total Stores
                </h3>

                <div
                    class="stat-number"
                    id="totalStores"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Total Ratings
                </h3>

                <div
                    class="stat-number"
                    id="totalRatings"
                >
                    0
                </div>

            </div>


        </div>


        <!-- =========================
             USERS SECTION
        ========================= -->

        <div class="section">

            <h2>
                Registered Users
            </h2>


            <input
                type="text"
                id="userSearch"
                class="search-box"
                placeholder="Search users..."
                onkeyup="searchUsers()"
            >


            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Role
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="usersTable"
                >
                </tbody>

            </table>


        </div>


        <!-- =========================
             STORES SECTION
        ========================= -->

        <div class="section">

            <h2>
                Stores
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Store Name
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Address
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="storesTable"
                >
                </tbody>

            </table>


        </div>


        <!-- =========================
             RATINGS SECTION
        ========================= -->

        <div class="section">

            <h2>
                Submitted Ratings
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            User
                        </th>

                        <th>
                            Store
                        </th>

                        <th>
                            Rating
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="ratingsTable"
                >
                </tbody>

            </table>


        </div>


    </main>


    <script>

        // =========================
        // CHECK LOGIN AND ROLE
        // =========================

        const token =
            localStorage.getItem("token");

        const user =
            JSON.parse(
                localStorage.getItem("user")
            );


        if (!token || !user) {

            window.location.href =
                "login.html";

        }
        else if (user.role !== "admin") {

            alert(
                "Admin access only!"
            );

            window.location.href =
                "index.html";

        }
        else {

            document
                .getElementById("adminName")
                .textContent =
                user.name;

        }


        // =========================
        // LOAD USERS
        // =========================

        async function loadUsers() {

            try {

                const response =
                    await fetch(
                        "/admin/users",
                        {
                            headers: {
                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );


                const users =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        users.message ||
                        "Unable to load users"
                    );

                }


                const usersTable =
                    document.getElementById(
                        "usersTable"
                    );


                usersTable.innerHTML = "";


                users.forEach(userData => {

                    usersTable.innerHTML += `

                        <tr>

                            <td>
                                ${userData.id}
                            </td>

                            <td>
                                ${userData.name}
                            </td>

                            <td>
                                ${userData.email}
                            </td>

                            <td>
                                ${userData.role}
                            </td>

                        </tr>

                    `;

                });


                document
                    .getElementById(
                        "totalUsers"
                    )
                    .textContent =
                    users.length;


            }
            catch (error) {

                console.error(
                    "Users error:",
                    error
                );

            }

        }


        // =========================
        // LOAD STORES
        // =========================

        async function loadStores() {

            try {

                const response =
                    await fetch(
                        "/stores"
                    );


                const stores =
                    await response.json();


                const storesTable =
                    document.getElementById(
                        "storesTable"
                    );


                storesTable.innerHTML = "";


                stores.forEach(store => {

                    storesTable.innerHTML += `

                        <tr>

                            <td>
                                ${store.id}
                            </td>

                            <td>
                                ${store.name}
                            </td>

                            <td>
                                ${store.email}
                            </td>

                            <td>
                                ${store.address}
                            </td>

                        </tr>

                    `;

                });


                document
                    .getElementById(
                        "totalStores"
                    )
                    .textContent =
                    stores.length;


            }
            catch (error) {

                console.error(
                    "Stores error:",
                    error
                );

            }

        }


        // =========================
        // LOAD RATINGS
        // =========================

        async function loadRatings() {

            try {

                const response =
                    await fetch(
                        "/admin/ratings",
                        {
                            headers: {
                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );


                const ratings =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        ratings.message ||
                        "Unable to load ratings"
                    );

                }


                const ratingsTable =
                    document.getElementById(
                        "ratingsTable"
                    );


                ratingsTable.innerHTML = "";


                ratings.forEach(rating => {

                    ratingsTable.innerHTML += `

                        <tr>

                            <td>
                                ${rating.id}
                            </td>

                            <td>
                                ${rating.user_name}
                            </td>

                            <td>
                                ${rating.store_name}
                            </td>

                            <td>
                                ⭐ ${rating.rating} / 5
                            </td>

                        </tr>

                    `;

                });


                document
                    .getElementById(
                        "totalRatings"
                    )
                    .textContent =
                    ratings.length;


            }
            catch (error) {

                console.error(
                    "Ratings error:",
                    error
                );

            }

        }


        // =========================
        // SEARCH USERS
        // =========================

        function searchUsers() {

            const searchValue =
                document
                    .getElementById(
                        "userSearch"
                    )
                    .value
                    .toLowerCase();


            const rows =
                document
                    .querySelectorAll(
                        "#usersTable tr"
                    );


            rows.forEach(row => {

                const rowText =
                    row.textContent
                        .toLowerCase();


                if (
                    rowText.includes(
                        searchValue
                    )
                ) {

                    row.style.display = "";

                }
                else {

                    row.style.display =
                        "none";

                }

            });

        }


        // =========================
        // LOGOUT
        // =========================

        function logout() {

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );


            window.location.href =
                "login.html";

        }


        // =========================
        // LOAD DASHBOARD DATA
        // =========================

        loadUsers();

        loadStores();

        loadRatings();

    </script>


</body>

</html>
