<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Store Rating App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #3f51b5, #2196f3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #40538b;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #40538b;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #40538b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2f4075;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        .register-text {
            text-align: center;
            margin-top: 22px;
        }

        .register-text a {
            color: #40538b;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Store Rating App</h1>

        <p class="subtitle">
            Login to continue
        </p>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <p class="register-text">
            Don't have an account?
            <a href="register.html">
                Register here
            </a>
        </p>

    </div>

    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                try {

                    const response =
                        await fetch("/login", {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })

                        });

                    const data =
                        await response.json();

                    if (!response.ok) {

                        message.style.color = "red";

                        message.innerText =
                            data.message ||
                            "Login failed";

                        return;
                    }

                    // Save login information
                    localStorage.setItem(
                        "token",
                        data.token
                    );

                    localStorage.setItem(
                        "user",
                        JSON.stringify(data.user)
                    );

                    message.style.color = "green";

                    message.innerText =
                        "Login successful!";

                    // Redirect based on role
                    setTimeout(() => {

                        if (data.user.role === "admin") {

                            window.location.href =
                                "admin.html";

                        } else if (
                            data.user.role === "store_owner"
                        ) {

                            window.location.href =
                                "owner.html";

                        } else {

                            window.location.href =
                                "index.html";
                        }

                    }, 700);

                }

                catch (error) {

                    message.style.color = "red";

                    message.innerText =
                        "Server error. Please try again.";

                }

            });

    </script>

</body>
</html>
